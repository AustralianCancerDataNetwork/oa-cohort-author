[project]
name = "oa-cohort-author"
dynamic = ["version"]
description = "Stable authoring service layer for oa-cohorts"
readme = "README.md"
authors = [
    { name = "Georgie Kennedy", email = "georgina.kennedy@unsw.edu.au" }
]
requires-python = ">=3.12"
dependencies = [
    # 0.10.0: ReportIndicatorMap and the per-report override columns.
    "oa-cohorts>=0.10.0",
    "sqlalchemy>=2.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { tag_regex = '^v?(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$' }

[tool.hatch.build.targets.wheel]
packages = ["src/oa_cohort_author"]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.0",
  "ty==0.0.61",
  # Pinned to match oa-cohorts rather than the wider stack's <0.16: this repo's
  # findings under 0.16 have been driven to zero, and a floor alone would let a
  # lockfile refresh drop back to 0.15 and stop enforcing that.
  "ruff>=0.16.1,<0.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
ignore = [
  # TODO: PEP 695 `type` aliases.
  "UP040",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["DTZ011"]
# Each of these narrows a caller-supplied definition into a status or preview
# result, where any failure is reported rather than raised.
"src/oa_cohort_author/loaders.py" = ["BLE001"]
"src/oa_cohort_author/mutations.py" = ["BLE001"]
"src/oa_cohort_author/preview.py" = ["BLE001"]
